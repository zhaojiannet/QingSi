# 工作区只有项目自己。pnpm 9 遇到没有 packages 的 pnpm-workspace.yaml 直接报错，
# 托管平台按 packageManager 切换之前用的可能就是旧版 pnpm
packages:
  - '.'

# 新版本发布满 3 天才装
minimumReleaseAge: 4320

# 不装信任等级比之前版本低的新版本
trustPolicy: no-downgrade
# 已核实的误报，只放行确切版本：
# semver@5.7.2、6.3.1 是 npm 团队 2023-07-10 在旧版本线上手动发的安全补丁，比带来源证明的 7.5.4 晚三天，被判成降级；
# chokidar@4.0.3 和带来源证明的 4.0.1 是同一个维护者发的，只是没在 CI 里发布，没有来源证明
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@5.7.2
  - semver@6.3.1

# 只有列出来的包允许在安装时运行脚本，其他包的安装脚本一律拦截
allowBuilds:
  '@prisma/client': true
  esbuild: true
  '@prisma/engines': true
  prisma: true

overrides:
  '@hono/node-server@<1.19.15': ^1.19.15
  deepmerge-ts@<8.0.0: ^8.0.0
  mariadb@>=3.3.0 <3.5.4: ^3.5.4
  mysql2@<=3.23.0: ^3.23.1
  valibot@<=1.4.1: ^1.4.2
permissions:
  dotenv:
    skills: false
