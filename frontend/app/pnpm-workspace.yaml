# 工作区只有项目自己。pnpm 9 遇到没有 packages 的 pnpm-workspace.yaml 直接报错，
# 托管平台按 packageManager 切换之前用的可能就是旧版 pnpm
packages:
  - '.'

# 新版本发布满 3 天才装
minimumReleaseAge: 4320

# 不装信任等级比之前版本低的新版本
trustPolicy: no-downgrade
# 已核实的误报，只放行确切版本：
# semver@5.7.2、6.3.1 是 npm 团队 2023-07-10 在旧版本线上手动发的安全补丁，比带来源证明的 7.5.4 晚三天，被判成降级；
# chokidar@4.0.3 和带来源证明的 4.0.1 是同一个维护者发的，只是没在 CI 里发布，没有来源证明
trustPolicyExclude:
  - chokidar@4.0.3
  - semver@5.7.2
  - semver@6.3.1

# 只有列出来的包允许在安装时运行脚本，其他包的安装脚本一律拦截
allowBuilds:
  esbuild: true
  vue-demi: true

overrides:
  '@babel/core@<=7.29.0': ^7.29.6
  '@vue/server-renderer@<3.5.42': ^3.5.42
  axios@>=1.0.0 <1.20.0: ^1.20.0
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  brace-expansion@>=3.0.0 <5.0.7: ^5.0.7
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  browserslist@<=4.28.6: ^4.28.7
  echarts@<6.1.0: ^6.1.0
  follow-redirects@>=1.16.0 <1.16.1: ^1.16.1
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  nanoid@<3.3.18: ^3.3.18
  postcss-selector-parser@<7.1.6: ^7.1.6
  postcss@<=8.5.22: ^8.5.23
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  vite@>=8.0.0 <=8.1.5: ^8.1.6
